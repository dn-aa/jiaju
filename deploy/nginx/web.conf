# ============================================================
# 【代码段功能】前台官网 Nginx 站点配置（阶段 7 生产）
#   - 静态资源（构建产物）直接返回，长缓存
#   - /api/* 与 /uploads/* 反向代理到后端 api 服务
#   - SPA 路由兜底（history 模式回退 index.html）
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源：带 hash 的 assets 长缓存 30 天
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端接口代理（FastAPI，容器网络内服务名 api）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 文件上传（简历/图片）体量上限
        client_max_body_size 12m;
    }

    # 上传文件（本地存储后端；生产切换 OSS 后此段可移除）
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA 路由兜底（/products/1、/news/2 等直接访问）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
