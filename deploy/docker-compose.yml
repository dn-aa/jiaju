# TP 全屋家居 · 本地开发依赖编排（阶段 0：MySQL + Redis）
# 用法：docker compose up -d mysql redis
# 说明：web/admin/api 三个服务在阶段 7（部署）补全，见开发技术文档 §10.1。

services:
  mysql:
    image: mysql:8.0
    container_name: tp_home_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tp_home_dev
      MYSQL_DATABASE: tp_home_dev
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptp_home_dev"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: tp_home_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

