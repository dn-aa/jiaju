<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TP 全屋家居 · 后台管理系统（产品原型）</title>
<style>
  :root{
    --ink:#1C1917; --gold:#B0894F; --gold-d:#97763F; --bg:#FAFAF9; --soft:#F5F3EF; --line:#E7E5E4; --surface:#fff;
    --ff-disp:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
    --ff-body:"Montserrat","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
    --primary:#1C1917; --primary-hover:#2b2723; --primary-active:#000c17;
    --sider:#1C1917; --sider-hover:#B0894F; --sider-sub:#14110F;
    --layout-bg:#FAFAF9; --card-bg:#fff; --border:#E7E5E4; --border-strong:#d9d9d9;
    --text:#1f1f1f; --text-secondary:rgba(0,0,0,.65); --text-tertiary:rgba(0,0,0,.45);
    --success:#52c41a; --warning:#faad14; --error:#ff4d4f; --processing:#B0894F;
    --radius:8px;
    --shadow:0 1px 2px 0 rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px 0 rgba(0,0,0,.02);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    font-size:14px;color:var(--text);background:var(--layout-bg); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;background:linear-gradient(135deg,#211c17 0%,#1C1917 55%,#0d0b09 100%);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .login-card{width:400px;background:#fff;border-radius:14px;padding:44px 40px;box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .brand-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;}
  .brand-mark{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#1C1917,#3a332c);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;border:1px solid var(--gold);}
  .brand-name{font-size:18px;font-weight:700;color:#1C1917;letter-spacing:.5px;}
  .login-sub{text-align:center;color:var(--text-tertiary);margin:4px 0 24px;font-size:13px;}
  .field{margin-bottom:18px;}
  .field label{display:block;margin-bottom:6px;color:var(--text-secondary);font-size:13px;}
  .input{width:100%;height:40px;border:1px solid var(--border-strong);border-radius:6px;padding:0 11px;font-size:14px;outline:none;transition:.2s;background:#fff;}
  .input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,137,79,.14);}
  .btn{width:100%;height:40px;border:none;border-radius:6px;background:var(--primary);color:#fff;font-size:15px;font-weight:500;transition:.2s;}
  .btn:hover{background:var(--primary-hover);}
  .btn:active{background:var(--primary-active);}
  .login-hint{margin-top:18px;font-size:12px;color:var(--text-tertiary);line-height:1.7;border-top:1px dashed var(--border);padding-top:14px;}
  .role-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .role-chip{border:1px solid var(--border-strong);background:#fafafa;border-radius:6px;padding:8px 6px;text-align:center;font-size:12px;color:var(--text-secondary);transition:.15s;}
  .role-chip:hover{border-color:var(--gold);color:var(--gold);background:var(--soft);}
  /* ---------- Layout ---------- */
  #app{display:none;height:100vh;}
  .sider{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--sider);transition:width .2s;z-index:20;overflow:hidden;}
  .sider.collapsed{width:80px;}
  .sider-logo{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff;overflow:hidden;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.08);}
  .sider-logo .mark{width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,#1C1917,#3a332c);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;border:1px solid var(--gold);flex:0 0 auto;}
  .sider-logo .name{font-weight:600;font-size:15px;letter-spacing:.5px;}
  .sider-logo .sub{font-size:11px;color:rgba(255,255,255,.45);}
  .menu{padding:8px 0;overflow-y:auto;height:calc(100% - 64px);}
  .menu-item{color:rgba(255,255,255,.75);padding:11px 24px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;white-space:nowrap;transition:.15s;user-select:none;}
  .menu-item:hover{color:#fff;background:rgba(255,255,255,.08);}
  .menu-item.active{color:#fff;background:var(--primary);}
  .menu-item .ico{width:16px;text-align:center;flex:0 0 auto;}
  .menu-group>.menu-item{font-weight:500;}
  .menu-sub{background:var(--sider-sub);overflow:hidden;}
  .menu-sub .menu-item{padding-left:52px;font-size:13px;}
  .sider.collapsed .label,.sider.collapsed .sub{display:none;}
  .sider.collapsed .menu-sub{display:none;}
  .sider.collapsed .sider-logo .name,.sider.collapsed .sider-logo .sub{display:none;}
  .main{margin-left:220px;margin-top:0;transition:margin-left .2s;display:flex;flex-direction:column;height:100vh;}
  .main.collapsed{margin-left:80px;}
  .header{height:64px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:10;}
  .header-left{display:flex;align-items:center;gap:16px;}
  .collapse-btn{border:none;background:transparent;font-size:18px;color:var(--text-secondary);padding:4px 8px;border-radius:6px;}
  .collapse-btn:hover{background:#f5f5f5;}
  .breadcrumb{color:var(--text-tertiary);font-size:13px;}
  .breadcrumb b{color:var(--text);font-weight:500;}
  .header-right{display:flex;align-items:center;gap:14px;}
  .role-badge{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--soft);color:var(--gold);border:1px solid #e8d3ad;}
  .user-box{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 8px;border-radius:6px;}
  .user-box:hover{background:#f5f5f5;}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden;flex:0 0 auto;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  /* ---------- 个人中心 ---------- */
  .user-card{display:flex;align-items:center;padding:4px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .uc-avatar{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;position:relative;border:2px solid #fff;}
  .uc-avatar img{width:100%;height:100%;object-fit:cover;}
  .uc-avatar .cam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;}
  .uc-meta{margin-left:14px;}
  .uc-meta .n{font-size:16px;font-weight:600;}
  .uc-meta .r{font-size:12px;color:var(--text-tertiary);margin-top:3px;}
  .field .err{color:var(--error);font-size:12px;margin-top:4px;display:none;}
  .field .err.show{display:block;}
  .pwd-rule{font-size:12px;color:var(--text-tertiary);margin-top:8px;line-height:1.7;}
  .content{flex:1;overflow-y:auto;padding:28px 32px;width:100%;max-width:1320px;margin:0 auto;}
  .page-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 28px;width:100%;}
  .page-title{font-size:22px;font-weight:600;margin:0 0 8px;letter-spacing:.01em;}
  .page-desc{color:var(--text-tertiary);font-size:13px;margin-bottom:22px;line-height:1.6;}
  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px;}
  .toolbar .spacer{flex:1;}
  .search-input{height:32px;width:220px;border:1px solid var(--border-strong);border-radius:6px;padding:0 11px;outline:none;}
  .search-input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,137,79,.14);}
  .select{height:32px;border:1px solid var(--border-strong);border-radius:6px;padding:0 8px;background:#fff;outline:none;color:var(--text-secondary);}
  .btn-sm{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;color:var(--text-secondary);font-size:13px;transition:.15s;}
  .btn-sm:hover{border-color:var(--primary);color:var(--primary);}
  .btn-sm.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn-sm.primary:hover{background:var(--primary-hover);color:#fff;}
  .btn-sm.danger{color:var(--error);border-color:#ffccc7;}
  .btn-sm.danger:hover{background:#fff1f0;color:var(--error);border-color:var(--error);}
  /* ---------- Table ---------- */
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th{background:#fafafa;text-align:left;padding:14px 16px;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px;}
  table.tbl td{padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;}
  table.tbl tr:hover td{background:#fafafa;}
  .tbl td .link{margin-right:10px;display:inline-block;}
  .tbl td .link:last-child{margin-right:0;}
  .tag{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;line-height:22px;border:1px solid transparent;}
  .tag-success{color:var(--success);background:#f6ffed;border-color:#b7eb8f;}
  .tag-processing{color:var(--gold);background:var(--soft);border-color:#e8d3ad;}
  .tag-warning{color:#d46b08;background:#fffbe6;border-color:#ffe58f;}
  .tag-error{color:var(--error);background:#fff1f0;border-color:#ffccc7;}
  .tag-default{color:var(--text-secondary);background:#fafafa;border-color:#d9d9d9;}
  .tag-gold{color:var(--gold);background:#fbf5ec;border-color:#e8d3ad;}
  .link{color:var(--primary);cursor:pointer;}
  .link:hover{text-decoration:underline;}
  .muted{color:var(--text-tertiary);}
  /* ---------- stat cards ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:22px;}
  .stat-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;border-left:3px solid var(--primary);}
  .stat-card .k{color:var(--text-tertiary);font-size:13px;margin-bottom:10px;}
  .stat-card .v{font-size:28px;font-weight:600;color:#1C1917;}
  .stat-card .trend{font-size:12px;margin-top:6px;color:var(--success);}
  .stat-card.gold{border-left-color:var(--gold);}
  .stat-card.green{border-left-color:var(--success);}
  /* ---------- tabs ---------- */
  .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;gap:4px;}
  .tab{padding:11px 18px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;font-size:14px;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500;}
  /* ---------- drawer & modal ---------- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;}
  .mask.show{display:block;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:440px;background:#fff;z-index:60;box-shadow:-4px 0 16px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;}
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head .t{font-size:16px;font-weight:600;}
  .drawer-body{padding:20px;overflow-y:auto;flex:1;}
  .drawer-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:60;background:#fff;border-radius:10px;width:560px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.18s;max-height:88vh;display:flex;flex-direction:column;}
  .modal.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
  .modal-head{padding:16px 22px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .modal-body{padding:20px 22px;overflow-y:auto;}
  .modal-foot{padding:12px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .x{border:none;background:transparent;font-size:18px;color:var(--text-tertiary);cursor:pointer;}
  .x:hover{color:var(--text);}
  .form-row{margin-bottom:18px;}
  .form-row label{display:block;margin-bottom:8px;font-size:13px;color:var(--text-secondary);}
  .form-row label .req{color:var(--error);margin-right:3px;}
  .form-input{width:100%;height:36px;border:1px solid var(--border-strong);border-radius:6px;padding:0 11px;outline:none;font-size:14px;}
  .form-input:focus,.form-textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,137,79,.14);}
  .form-textarea{width:100%;min-height:92px;border:1px solid var(--border-strong);border-radius:6px;padding:8px 11px;outline:none;resize:vertical;font-family:inherit;font-size:14px;}
  .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;}
  .seg button{border:none;background:#fff;padding:6px 14px;font-size:13px;color:var(--text-secondary);}
  .seg button.on{background:var(--primary);color:#fff;}
  .upload{border:1px dashed var(--border-strong);border-radius:6px;padding:18px;text-align:center;color:var(--text-tertiary);background:#fafafa;cursor:pointer;transition:.15s;}
  .upload:hover{border-color:var(--gold);color:var(--gold);background:var(--soft);}
  /* ---------- misc ---------- */
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .kv{font-size:13px;line-height:2.1;}
  .kv .k{color:var(--text-tertiary);display:inline-block;width:84px;}
  .timeline-item{border-left:2px solid var(--border-strong);padding:0 0 18px 16px;position:relative;margin-left:6px;}
  .timeline-item::before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--primary);}
  .timeline-item .yr{font-weight:600;color:#1C1917;}
  .perm-tree{font-size:13px;}
  .perm-tree .mod{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;}
  .perm-tree .mod .mh{font-weight:600;margin-bottom:8px;}
  .chk{display:inline-flex;align-items:center;gap:5px;margin-right:14px;margin-bottom:6px;color:var(--text-secondary);}
  .pagination{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center;color:var(--text-tertiary);font-size:13px;}
  .pg{border:1px solid var(--border-strong);background:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--text-secondary);}
  .pg.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .empty{text-align:center;color:var(--text-tertiary);padding:48px 0;}
  .empty .ic{font-size:40px;opacity:.4;}
  .no-perm{text-align:center;padding:80px 0;color:var(--text-tertiary);}
  .no-perm .ic{font-size:48px;opacity:.3;display:block;margin-bottom:12px;}
  .chart-box{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;}
  .chart-box h4{margin:0 0 14px;font-size:15px;}
  .note{background:var(--soft);border:1px solid #e8d3ad;border-radius:6px;padding:12px 14px;font-size:12px;color:#8a6d3b;margin-bottom:18px;line-height:1.7;}
  .scope-tip{display:inline-block;background:#fbf5ec;border:1px solid #e8d3ad;color:#8a6d3b;border-radius:4px;padding:3px 10px;font-size:12px;margin-left:14px;}
  @media (max-width:768px){.stat-row{grid-template-columns:1fr 1fr;}.sider{width:0;}.main{margin-left:0;}}
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:10px 18px;z-index:200;display:flex;align-items:center;gap:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;top:90px;}
  .toast .ic{color:var(--success);}

  /* ============ 与「墨色 + 香槟金」前台风格统一 ============ */
  body{font-family:var(--ff-body);}
  h1,h2,h3,h4,.page-title,.modal-head,.drawer-head .t,.chart-box h4,.brand-name,.login-sub{font-family:var(--ff-disp);letter-spacing:.01em;}
  .page-title{border-left:3px solid var(--gold);padding-left:12px;}
  /* 蓝色遗留 → 香槟金 / 墨色 */
  .role-badge{background:var(--soft);color:var(--gold);border-color:#e8d3ad;}
  .role-chip:hover{border-color:var(--gold);color:var(--gold);background:var(--soft);}
  .search-input:focus,.form-input:focus,.form-textarea:focus,.input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,137,79,.14);}
  .btn-sm:hover{border-color:var(--gold);color:var(--gold);}
  .tag-processing{color:var(--gold);background:var(--soft);border-color:#e8d3ad;}
  .login-hint{border-top-color:var(--line);}
  .note{background:var(--soft);border-color:#e8d3ad;color:#8a6d3b;}
  /* 侧边菜单选中态 → 香槟金（在墨色侧栏上醒目且对比达标） */
  .menu-item.active{background:rgba(176,137,79,.16);color:var(--gold);box-shadow:inset 3px 0 0 var(--gold);}
  /* 登录页渐变 → 墨色基调（呼应前台高端质感） */
  #login{background:linear-gradient(135deg,#211c17 0%,#1C1917 55%,#0d0b09 100%);}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .timeline-item::before{background:var(--gold);}
  /* 头像 / 强调点缀 */
  .avatar,.uc-avatar{background:linear-gradient(135deg,#2b2723,#6b6256);}
  .stat-card{border-left-color:var(--gold);}
  .stat-card.green{border-left-color:var(--success);}
  .scope-tip{background:var(--soft);}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="brand-logo">
      <div class="brand-mark">TP</div>
      <div style="text-align:left;">
        <div class="brand-name">TP 全屋家居</div>
        <div style="font-size:11px;color:var(--text-tertiary);">后台管理系统</div>
      </div>
    </div>
    <div class="login-sub">BR-1 登录与权限 · 账号密码登录</div>
    <div class="field">
      <label>账号</label>
      <input class="input" id="acc" value="admin" />
    </div>
    <div class="field">
      <label>密码</label>
      <input class="input" id="pwd" type="password" value="123456" placeholder="请输入密码" />
    </div>
    <button class="btn" onclick="doLogin()">登 录</button>
    <div class="login-hint">
      演示角色快速进入（RBAC 权限隔离见 §8 角色权限矩阵）：
      <div class="role-quick">
        <div class="role-chip" onclick="quickLogin('admin')">超级管理员</div>
        <div class="role-chip" onclick="quickLogin('editor')">内容编辑</div>
        <div class="role-chip" onclick="quickLogin('cs')">客服</div>
        <div class="role-chip" onclick="quickLogin('hr')">招聘专员</div>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <aside class="sider" id="sider">
    <div class="sider-logo">
      <div class="mark">TP</div>
      <div>
        <div class="name">TP 全屋家居</div>
        <div class="sub">后台管理系统</div>
      </div>
    </div>
    <nav class="menu" id="menu"></nav>
  </aside>

  <div class="main" id="main">
    <header class="header">
      <div class="header-left">
        <button class="collapse-btn" onclick="toggleCollapse()">☰</button>
        <div class="breadcrumb" id="crumb">工作台</div>
      </div>
      <div class="header-right">
        <span class="role-badge" id="roleBadge">超级管理员</span>
        <div class="user-box" onclick="showUserMenu()">
          <div class="avatar" id="avatar">A</div>
          <span id="userName">超级管理员</span>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="mask" id="mask" onclick="closeOverlays()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><span class="t" id="drawerTitle">详情</span><button class="x" onclick="closeOverlays()">✕</button></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</div>
<div class="modal" id="modal">
  <div class="modal-head"><span id="modalTitle">标题</span><button class="x" onclick="closeOverlays()">✕</button></div>
  <div class="modal-body" id="modalBody"></div>

<div class="toast" id="toast"><span class="ic">✓</span><span id="toastMsg">操作成功</span></div>
<input type="file" id="avatarInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none" onchange="onAvatarChange(event)" />

<script>
/* ===================== 角色与权限（PRD §2.2 / §8） ===================== */
const ROLES = {
  admin:{name:'超级管理员', avatar:'A', menu:['dashboard','content','recruit','lead','system'],
    content:['product','case','news','page'], recruit:['job','resume'], lead:['appointment','message'], system:['account','role','log'],
    dashboardScope:'all'},
  editor:{name:'内容编辑', avatar:'E', menu:['content'],
    content:['product','case','news','page']},
  cs:{name:'客服', avatar:'C', menu:['dashboard','lead'], lead:['appointment','message'], dashboardScope:'cs'},
  hr:{name:'招聘专员', avatar:'H', menu:['dashboard','recruit'], recruit:['job','resume'], dashboardScope:'hr'},
};
const MENU_DEF = {
  dashboard:{label:'工作台', ico:'📊'},
  content:{label:'内容管理', ico:'📁', children:['product','case','news','page']},
  product:{label:'产品管理'},
  case:{label:'案例管理'},
  news:{label:'新闻管理'},
  page:{label:'页面内容 / Banner'},
  recruit:{label:'招聘管理', ico:'💼', children:['job','resume']},
  job:{label:'职位管理'},
  resume:{label:'简历投递管理'},
  lead:{label:'线索管理', ico:'📨', children:['appointment','message']},
  appointment:{label:'在线预约管理'},
  message:{label:'留言咨询管理'},
  system:{label:'系统管理', ico:'⚙️', children:['account','role','log']},
  account:{label:'账号管理'},
  role:{label:'角色管理'},
  log:{label:'操作日志'},
};
/* §8 数据看板角色数据维度 */
const DASH_SCOPE = {
  all:['appointment','message','resume'],
  cs:['appointment','message'],
  hr:['resume'],
};

let state = {role:'admin', view:'dashboard', collapsed:false, subView:null, avatarImg:null};

/* ============ 模块列表数据（原型演示数据，支持编辑/状态切换持久化） ============ */
const P_DATA=[
  ['云隐布艺沙发','客厅','3','上架'],
  ['胡桃木餐桌','餐厅','1','上架'],
  ['简奢主卧床','卧室','2','上架'],
  ['书香书柜','书房','5','下架'],
  ['全屋定制·现代极简','全屋定制','0','上架'],
];
const C_DATA=[
  ['麓湖·现代极简平层','客户实景','现代','客厅','128㎡','上架'],
  ['云隐别墅设计方案','设计方案','轻奢','全屋','320㎡','上架'],
  ['书香门第三居','客户实景','新中式','书房','98㎡','下架'],
];
const N_DATA=[
  ['TP 全屋家居获 2026 红点设计大奖','企业新闻','2026-08-12','品牌部','已发布'],
  ['行业观察：2026 高端定制家居趋势','行业资讯','2026-08-09','编辑部','已发布'],
  ['TP 夏季新品发布会圆满落幕','企业新闻','2026-08-05','品牌部','草稿'],
];
const J_DATA=[
  ['全屋定制设计师','社会招聘','设计部','上海','20-35K','招聘中'],
  ['空间搭配顾问','社会招聘','销售部','北京','12-20K','招聘中'],
  ['管培生（家居设计方向）','校园招聘','人力部','全国','面议','已暂停'],
];
const B_DATA=[
  ['首页轮播-1 现代极简','/home','1','上线','2026-08-20'],
  ['首页轮播-2 轻奢样板间','/case','2','上线','—'],
  ['品牌活动-Banner','/news','3','下线','—'],
];
const H_DATA=[
  ['2009','TP 全屋家居品牌成立'],
  ['2015','建成首个智能制造基地'],
  ['2020','获「中国高端定制家居十强」'],
  ['2026','红点设计大奖'],
];
const A_DATA=[
  ['admin','超级管理员','超级管理员','启用'],
  ['editor01','内容编辑','内容编辑','启用'],
  ['cs01','客服小李','客服','启用'],
  ['hr01','招聘专员王','招聘专员','禁用'],
];
const SERIES=[['客厅','3',1,'启用'],['卧室','2',2,'启用'],['书房','1',3,'启用'],['全屋定制','5',4,'启用']];
let editing={kind:null,idx:null};

/* ===================== 登录 ===================== */
function doLogin(){
  const acc=document.getElementById('acc').value.trim();
  if(!acc){toast('请输入账号',true);return;}
  enter('admin'); // 演示：任意账号以超级管理员进入
}
function quickLogin(r){ state.role=r; enter(r); }
function enter(r){
  state.role=r; state.view = (r==='editor')?'product':'dashboard'; state.subView=null; state.avatarImg=null;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  renderUser();
  renderMenu(); render();
}
/* 渲染顶部用户信息（账号名 + 角色徽标 + 头像，头像支持上传图片） */
function renderUser(){
  const r=ROLES[state.role];
  document.getElementById('roleBadge').textContent=r.name;
  document.getElementById('userName').textContent=r.name;
  const av=document.getElementById('avatar');
  av.innerHTML = state.avatarImg ? `<img src="${state.avatarImg}" alt="">` : r.avatar;
}
function logout(){ location.reload(); }
/* 个人中心：头像上传 + 修改密码 + 退出登录 */
function showUserMenu(){
  const r=ROLES[state.role];
  const avHtml = state.avatarImg ? `<img src="${state.avatarImg}" alt="">` : r.avatar;
  openModal('个人中心', `
    <div class="user-card">
      <div class="uc-avatar" onclick="document.getElementById('avatarInput').click()" title="点击上传头像">
        ${avHtml}<span class="cam">✎</span>
      </div>
      <div class="uc-meta">
        <div class="n">${r.name}</div>
        <div class="r">${state.role==='admin'?'admin':state.role} · ${r.name}</div>
      </div>
    </div>
    <div class="kv">
      <div><span class="k">账号</span>${state.role==='admin'?'admin':state.role}</div>
      <div><span class="k">当前角色</span>${r.name}</div>
    </div>
    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn-sm" onclick="document.getElementById('avatarInput').click()">🖼️ 上传头像</button>
      <button class="btn-sm" onclick="openChangePwd()">🔒 修改密码</button>
    </div>
    <div class="pwd-rule">头像支持 JPG / PNG / GIF / WebP，大小不超过 2MB；修改密码需输入原密码验证（详见 PRD BR-1）。</div>
  `, `<button class="btn-sm" onclick="closeOverlays()">取消</button><button class="btn-sm danger" onclick="logout()">退出登录</button>`);
}
/* 头像上传：校验类型与大小，预览并同步到顶部头像 */
function onAvatarChange(e){
  const f=e.target.files && e.target.files[0];
  if(!f){return;}
  if(!/^image\//.test(f.type)){ toast('请选择图片文件', true); e.target.value=''; return; }
  if(f.size > 2*1024*1024){ toast('头像图片不能超过 2MB', true); e.target.value=''; return; }
  const rd=new FileReader();
  rd.onload=function(){
    state.avatarImg=rd.result;
    renderUser();
    const uc=document.querySelector('.uc-avatar'); // 个人中心仍开时同步刷新
    if(uc) uc.innerHTML = state.avatarImg ? `<img src="${state.avatarImg}" alt="">` : ROLES[state.role].avatar;
    toast('头像已更新');
  };
  rd.readAsDataURL(f);
  e.target.value='';
}
/* 修改密码弹窗 */
function openChangePwd(){
  openModal('修改密码', `
    <div class="field">
      <label>原密码</label>
      <input class="input" id="op-old" type="password" placeholder="请输入当前密码" />
      <div class="err" id="op-old-err">请输入原密码</div>
    </div>
    <div class="field">
      <label>新密码</label>
      <input class="input" id="op-new" type="password" placeholder="6-20 位，建议字母 + 数字组合" />
      <div class="err" id="op-new-err">新密码至少 6 位</div>
    </div>
    <div class="field">
      <label>确认新密码</label>
      <input class="input" id="op-conf" type="password" placeholder="再次输入新密码" />
      <div class="err" id="op-conf-err">两次输入的新密码不一致</div>
    </div>
    <div class="pwd-rule">密码安全建议：长度 6-20 位，避免与账号相同或纯数字；正式上线由后端以 bcrypt 等强哈希存储（PRD BR-1 / §9 账号表）。</div>
  `, `<button class="btn-sm" onclick="closeOverlays()">取消</button><button class="btn-sm primary" onclick="submitChangePwd()">保存</button>`);
}
function submitChangePwd(){
  const old=document.getElementById('op-old').value.trim();
  const nw=document.getElementById('op-new').value;
  const conf=document.getElementById('op-conf').value;
  let ok=true;
  const setErr=(id,msg,on)=>{const el=document.getElementById(id); if(on){el.textContent=msg;el.classList.add('show');ok=false;}else{el.classList.remove('show');}};
  setErr('op-old-err','请输入原密码', !old);
  setErr('op-new-err','新密码至少 6 位', nw.length<6);
  setErr('op-conf-err','两次输入的新密码不一致', conf!==nw);
  if(!ok) return;
  closeOverlays();
  toast('密码修改成功（演示）');
}

/* ===================== 菜单渲染（按角色过滤） ===================== */
function renderMenu(){
  const r=ROLES[state.role]; const el=document.getElementById('menu'); let h='';
  const allowed=r.menu;
  allowed.forEach(k=>{
    const def=MENU_DEF[k];
    if(def.children){
      const open = (state.view && (def.children.includes(state.view) || def.children.includes(state.subView)));
      h+=`<div class="menu-group">
        <div class="menu-item ${open?'active':''}" onclick="toggleGroup('${k}')">
          <span class="ico">${def.ico}</span><span class="label">${def.label}</span><span class="sub" style="margin-left:auto;font-size:10px;">▾</span>
        </div>
        <div class="menu-sub" id="sub-${k}" style="${open?'':'display:none'}">
          ${def.children.filter(c=> (r[k]?r[k].includes(c):true)).map(c=>`
            <div class="menu-item ${state.view===c?'active':''}" onclick="go('${c}')"><span class="label">${MENU_DEF[c].label}</span></div>
          `).join('')}
        </div>
      </div>`;
    } else {
      h+=`<div class="menu-item ${state.view===k?'active':''}" onclick="go('${k}')"><span class="ico">${def.ico}</span><span class="label">${def.label}</span></div>`;
    }
  });
  el.innerHTML=h;
}
function toggleGroup(k){
  const s=document.getElementById('sub-'+k);
  if(s) s.style.display = (s.style.display==='none')?'block':'none';
}
function go(v){
  state.view=v; state.subView=null;
  // 默认子视图
  if(['content','recruit','lead','system'].includes(v)){ state.subView = (ROLES[state.role][v]||MENU_DEF[v].children)[0]; }
  renderMenu(); render();
}
function breadcrumb(){
  const map = {dashboard:'工作台',product:'产品管理',case:'案例管理',news:'新闻管理',page:'页面内容 / Banner',
    job:'职位管理',resume:'简历投递管理',appointment:'在线预约管理',message:'留言咨询管理',
    account:'账号管理',role:'角色管理',log:'操作日志'};
  const parent={product:'内容管理',case:'内容管理',news:'内容管理',page:'内容管理',
    job:'招聘管理',resume:'招聘管理',appointment:'线索管理',message:'线索管理',
    account:'系统管理',role:'系统管理',log:'系统管理'};
  if(state.view==='dashboard'){document.getElementById('crumb').innerHTML='<b>工作台</b>';return;}
  const p=parent[state.view]||'';
  document.getElementById('crumb').innerHTML = p? `${p} / <b>${map[state.view]}</b>` : `<b>${map[state.view]}</b>`;
}
function toggleCollapse(){
  state.collapsed=!state.collapsed;
  document.getElementById('sider').classList.toggle('collapsed',state.collapsed);
  document.getElementById('main').classList.toggle('collapsed',state.collapsed);
}

/* ===================== 主渲染 ===================== */
function render(){
  breadcrumb();
  const v = state.subView||state.view;
  const map={
    dashboard:viewDashboard, product:viewProduct, case:viewCase, news:viewNews, page:viewPage,
    job:viewJob, resume:viewResume, appointment:viewAppointment, message:viewMessage,
    account:viewAccount, role:viewRole, log:viewLog,
  };
  const fn = map[v] || (()=>'<div class="no-perm"><span class="ic">🔒</span>当前角色无此模块权限</div>');
  document.getElementById('content').innerHTML = fn();
  document.getElementById('content').scrollTop=0;
}

/* ===================== BR-9 数据看板 ===================== */
function viewDashboard(){
  const scope = DASH_SCOPE[ROLES[state.role].dashboardScope];
  const cards=[
    {key:'appointment',k:'预约量（线索）',v:128,t:'较上周 +12%',cls:''},
    {key:'message',k:'留言量（线索）',v:64,t:'较上周 +5%',cls:'gold'},
    {key:'resume',k:'简历投递量',v:37,t:'较上周 +9%',cls:'green'},
  ].filter(c=>scope.includes(c.key));
  if(!scope.length) return '<div class="no-perm"><span class="ic">📊</span>当前角色（'+ROLES[state.role].name+'）无数据看板权限（§8）</div>';
  const scopeLabel = scope.map(s=>({appointment:'预约',message:'留言',resume:'简历'}[s])).join(' + ');
  return `
  <div class="page-card">
    <h2 class="page-title">工作台 · 线索量看板 <span class="scope-tip">数据范围：${scopeLabel}</span></h2>
    <div class="page-desc">BR-9 仅统计「线索量」（预约/留言/简历，来自数据库，无需前端埋点）。按角色限定数据维度（§8）。</div>
    <div class="note">说明：看板展示各线索表<b>原始条数（不去重）</b>；北极星指标「有效线索数」去重口径为同一手机号在预约/留言/简历三类线索中合并计数（见 §12）。</div>
    <div class="stat-row">
      ${cards.map(c=>`<div class="stat-card ${c.cls}"><div class="k">${c.k}</div><div class="v">${c.v}</div><div class="trend">${c.t}</div></div>`).join('')}
    </div>
    <div class="chart-box">
      <h4>线索趋势（按日）</h4>
      ${lineChart()}
    </div>
    <div class="chart-box">
      <h4>线索分类占比</h4>
      ${barChart(scope)}
    </div>
    <div class="chart-box">
      <h4>线索明细下钻（BR-9.2）</h4>
      <table class="tbl"><thead><tr><th>线索类型</th><th>今日</th><th>本周</th><th>本月</th><th>操作</th></tr></thead><tbody>
        ${[
          ['预约',12,86,128],['留言',6,41,64],['简历',4,22,37]
        ].filter(r=>scope.includes(r[0]==='预约'?'appointment':r[0]==='留言'?'message':'resume')).map(r=>`<tr>
          <td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td>
          <td><span class="link" onclick="drill('${r[0]==='预约'?'appointment':r[0]==='留言'?'message':'resume'}')">下钻明细</span></td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>`;
}
function drill(type){
  const map={appointment:'appointment',message:'message',resume:'resume'};
  go(map[type]);
}
function lineChart(){
  const w=640,h=180,pts=[[0,140],[60,120],[120,128],[180,96],[240,108],[300,80],[360,90],[420,64],[480,72],[540,52],[600,60]];
  const path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:180px;">
    <line x1="0" y1="${h-30}" x2="${w}" y2="${h-30}" stroke="#f0f0f0"/>
    <path d="${path}" fill="none" stroke="#B0894F" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#B0894F"/>`).join('')}
    <text x="0" y="${h-10}" font-size="11" fill="#999">周一</text>
    <text x="${w-34}" y="${h-10}" font-size="11" fill="#999">周日</text>
  </svg>`;
}
function barChart(scope){
  const data=[{appointment:['预约',128,'#B0894F']}, {message:['留言',64,'#B0894F']}, {resume:['简历',37,'#52c41a']}];
  const items=data.filter(d=>{const k=Object.keys(d)[0];return scope.includes(k);}).map(d=>Object.values(d)[0]);
  const max=128;
  return `<div style="display:flex;gap:30px;align-items:flex-end;height:160px;padding:10px 20px;">
    ${items.map(it=>`<div style="text-align:center;">
      <div style="height:${it[1]/max*120}px;width:48px;background:${it[2]};border-radius:6px 6px 0 0;"></div>
      <div style="margin-top:8px;font-size:13px;">${it[0]}</div>
      <div style="font-size:12px;color:#999;">${it[1]}</div></div>`).join('')}
  </div>`;
}

/* ===================== BR-2 产品管理 ===================== */
function viewProduct(){
  const tab = state.subView2||'product';
  return `<div class="page-card">
    <h2 class="page-title">产品管理 <span class="scope-tip">内容编辑可维护</span></h2>

    <div class="tabs">
      <div class="tab ${tab==='product'?'active':''}" onclick="sub2('product')">产品</div>
      <div class="tab ${tab==='series'?'active':''}" onclick="sub2('series')">产品系列</div>

}

function productTab(){

  return `<div class="toolbar">
    <input class="search-input" placeholder="搜索产品名称 / 系列"/>
    <select class="select"><option>全部系列</option><option>客厅</option><option>卧室</option><option>书房</option><option>全屋定制</option></select>

    ${rows.map((r,i)=>`<tr><td>${r[0]}</td><td><span class="tag tag-gold">${r[1]}</span></td><td class="muted">材质 / 尺寸 / 颜色</td><td>${r[2]}</td>

  return `<div class="toolbar"><span class="spacer"></span><button class="btn-sm primary" onclick="openSeriesModal()">+ 新增系列</button></div>
  <table class="tbl"><thead><tr><th>系列名称</th><th>产品数</th><th>排序</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag ${r[3]==='启用'?'tag-success':'tag-default'}">${r[3]}</span></td>
      <td><span class="link" onclick="openSeriesModal('${r[0]}')">编辑</span> &nbsp; <span class="link" onclick="toggleRowState(SERIES,${i},3,'启用','停用','系列')">${r[3]==='启用'?'停用':'启用'}</span> &nbsp; <span class="link" style="color:var(--error)" onclick="del('系列','${r[0]}')">删除</span></td></tr>`).join('')}
  </tbody></table>
  <div class="note" style="margin-top:14px;">BR-2.1 关联产品时禁止删除系列（前置校验）。</div>`;
}
function openSeriesModal(name){
  const edit=!!name;
  openModal(edit?'编辑系列':'新增系列', `

  const st=seg?seg.textContent:'上架';
  if(editing.kind==='product'&&editing.idx!=null){

function toggleRowState(arr,i,col,on,off,label){
  arr[i][col]=arr[i][col]===on?off:on;
  render();
  toast(label+'「'+arr[i][0]+'」已'+(arr[i][col]===on?on:off));
}
function segPick(grp,btn){document.querySelectorAll('#'+grp+' button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function onPickFile(ev,targetId){
  const f=ev.target.files && ev.target.files[0];
  if(!f) return;
  const el=document.getElementById(targetId);
  if(el) el.innerHTML='已选择：<b style="color:var(--gold)">'+f.name+'</b>（'+(f.size/1024).toFixed(0)+' KB）';
  toast('已选择文件：'+f.name);
}
function pickImg(elm,multi){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=!!multi;
  inp.onchange=()=>{
    if(!inp.files.length) return;
    if(multi){toast('已选择 '+inp.files.length+' 张图片（演示）');}
    else if(elm){elm.innerHTML=inp.files[0].name;elm.title=inp.files[0].name;toast('已选择：'+inp.files[0].name);}
  };
  inp.click();
}

  if(editing.idx!=null){B_DATA[editing.idx]=row;toast('Banner「'+t+'」已保存');}
  else{B_DATA.unshift(row);toast('Banner「'+t+'」已新增');}
  editing={kind:null,idx:null};closeOverlays();render();
}

/* ---- 账号：编辑 / 新增 / 保存 ---- */
function openAccountModal(){openAccountForm(null);}
function openEditAccount(i){openAccountForm(i);}
function openAccountForm(i){
  editing={kind:'account',idx:i};
  const r=i!=null?A_DATA[i]:null;
  openModal(i!=null?'编辑账号':'新增账号', `
    <div class="form-row"><label><span class="req">*</span>账号</label><input class="form-input" id="a-acc" value="${r?r[0]:''}"/></div>
    <div class="form-row"><label>昵称</label><input class="form-input" id="a-name" value="${r?r[1]:''}"/></div>
    <div class="form-row"><label>角色</label><select class="form-input" id="a-role"><option>超级管理员</option><option>内容编辑</option><option>客服</option><option>招聘专员</option></select></div>
    <div class="form-row"><label>状态</label><div class="seg" id="a-seg"><button class="${!r||r[3]==='启用'?'on':''}" onclick="segPick('a-seg',this)">启用</button><button class="${r&&r[3]==='禁用'?'on':''}" onclick="segPick('a-seg',this)">禁用</button></div></div>
  `, `<button class="btn-sm" onclick="closeOverlays()">取消</button><button class="btn-sm primary" onclick="saveAccount()">保存</button>`);
  if(r){document.getElementById('a-role').value=r[2];}
}
function saveAccount(){
  const acc=document.getElementById('a-acc').value.trim();
  if(!acc){toast('请填写账号',true);return;}
  const seg=document.querySelector('#a-seg button.on');
  const row=[acc,document.getElementById('a-name').value.trim()||acc,document.getElementById('a-role').value,seg?seg.textContent:'启用'];
  if(editing.idx!=null){A_DATA[editing.idx]=row;toast('账号「'+acc+'」已保存');}
  else{A_DATA.push(row);toast('账号「'+acc+'」已新增');}
  editing={kind:null,idx:null};closeOverlays();render();
}

/* ---- 发展历程：编辑 / 新增 / 删除 ---- */
function openHistoryModal(){openHistoryForm(null);}
function openEditHistory(i){openHistoryForm(i);}
function openHistoryForm(i){
  editing={kind:'history',idx:i};
  const r=i!=null?H_DATA[i]:null;
  openModal(i!=null?'编辑条目':'新增条目', `
    <div class="form-row"><label><span class="req">*</span>年份</label><input class="form-input" id="h-year" style="width:140px" value="${r?r[0]:''}"/></div>
    <div class="form-row"><label><span class="req">*</span>事件</label><input class="form-input" id="h-event" value="${r?r[1]:''}"/></div>
  `, `<button class="btn-sm" onclick="closeOverlays()">取消</button><button class="btn-sm primary" onclick="saveHistory()">保存</button>`);
}
function saveHistory(){
  const y=document.getElementById('h-year').value.trim(),e=document.getElementById('h-event').value.trim();
  if(!y||!e){toast('请填写年份与事件',true);return;}
  if(editing.idx!=null){H_DATA[editing.idx]=[y,e];toast('条目已保存');}
  else{H_DATA.push([y,e]);toast('条目已新增');}
  editing={kind:null,idx:null};closeOverlays();render();
}
function delHistory(i){
  if(confirm('确认删除发展历程条目「'+H_DATA[i][1]+'」？此操作将记录日志（§10.3）')){
    H_DATA.splice(i,1);render();toast('条目已删除');
  }
}

/* ===================== 通用 ===================== */
function pager(){return `<div class="pagination"><span>共 42 条</span><span class="pg">‹</span><span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">›</span></div>`;}
function del(type,n){ if(confirm('确认删除'+type+'「'+n+'」？此操作将记录日志（§10.3）')) toast(type+'「'+n+'」已删除'); }
function save(type){ toast(type+'已保存'); closeOverlays(); }

/* overlays */
function openModal(t,b,f){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modalFoot').innerHTML=f;document.getElementById('mask').classList.add('show');document.getElementById('modal').classList.add('show');}
function showDrawer(){document.getElementById('mask').classList.add('show');document.getElementById('drawer').classList.add('show');}
function closeOverlays(){document.getElementById('mask').classList.remove('show');document.getElementById('modal').classList.remove('show');document.getElementById('drawer').classList.remove('show');}
let toastTimer;
function toast(msg,err){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.querySelector('.ic').textContent=err?'⚠':'✓';t.querySelector('.ic').style.color=err?'#ff4d4f':'#52c41a';t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}
</script>
</body>
</html>
